name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        if: github.event_name != 'pull_request'
        id: acr
        env:
          ACR_NAME: ${{ vars.ACR_NAME }}
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"
          az acr login --name "$ACR_NAME"
          login_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ddadaal-me/ddadaal-me:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/ddadaal-me/ddadaal-me:${{ github.sha }}
            ${{ steps.acr.outputs.login_server }}/ddadaal-me/ddadaal-me:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
