name: build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm i --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - uses: docker/setup-buildx-action@v4

      - name: Sign in to Azure
        if: github.event_name != 'pull_request'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign in to Azure Container Registry
        if: github.event_name != 'pull_request'
        id: acr
        env:
          ACR_NAME: ${{ secrets.ACR_NAME }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          test -n "$ACR_NAME"

          az acr login \
            --name "$ACR_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID"

          login_server="$(az acr show \
            --name "$ACR_NAME" \
            --subscription "$AZURE_SUBSCRIPTION_ID" \
            --query loginServer \
            --output tsv)"

          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Build Docker image (pull request)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: ddadaal-me/ddadaal-me:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.login_server }}/ddadaal-me/ddadaal-me:${{ github.sha }}
            ${{ steps.acr.outputs.login_server }}/ddadaal-me/ddadaal-me:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up kubectl
        if: github.event_name != 'pull_request'
        uses: azure/setup-kubectl@v4
        with:
          version: v1.36.4

      - name: Configure K3s access
        if: github.event_name != 'pull_request'
        env:
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG }}
        run: |
          set -euo pipefail
          test -n "$KUBECONFIG_CONTENT"
          install -d -m 700 "$RUNNER_TEMP/kube"
          printf '%s' "$KUBECONFIG_CONTENT" > "$RUNNER_TEMP/kube/config"
          chmod 600 "$RUNNER_TEMP/kube/config"
          echo "KUBECONFIG=$RUNNER_TEMP/kube/config" >> "$GITHUB_ENV"

          kubectl --kubeconfig "$RUNNER_TEMP/kube/config" auth can-i \
            patch deployment/ddadaal-me -n ddadaalme --quiet

      - name: Deploy image to K3s
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.acr.outputs.login_server }}/ddadaal-me/ddadaal-me:${{ github.sha }}
        run: |
          set -euo pipefail
          kubectl -n ddadaalme set image deployment/ddadaal-me \
            ddadaal-me="$IMAGE"
          kubectl -n ddadaalme rollout status deployment/ddadaal-me --timeout=600s
